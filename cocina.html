<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cocina</title>
<link rel="manifest" href="manifest.json">
<style>
  body{margin:0;background:#0e1420;color:#e8eef7;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #223049;background:#0f1522}
  h1{font-size:16px;margin:0 8px 0 0}
  .btn{background:#223049;border:1px solid #2b3b59;color:#e8eef7;padding:8px 12px;border-radius:8px;cursor:pointer}
  main{padding:14px;max-width:1100px;margin:0 auto}
  .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media (max-width:1100px){ .cols{grid-template-columns:1fr}}
  .col{border:1px solid #2b3b59;border-radius:12px;padding:10px}
  .col h3{margin:0 0 10px 0}
  .card{border:1px solid #2b3b59;border-radius:10px;padding:10px;margin:8px 0;background:#0f1929}
  .meta{color:#9fb2ce;font-size:12px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px;border-bottom:1px solid #223049;text-align:left}
  .right{text-align:right}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
  .tag{display:inline-block;background:#2a3a5a;border-radius:999px;padding:2px 8px;margin-left:6px;font-size:11px}
  .pill{display:inline-block;background:#223049;border:1px solid #2b3b59;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:6px}
  .noteBox{margin:6px 0;padding:6px;border:1px dashed #f9d95b;color:#f9d95b;border-radius:8px;font-style:italic;white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <h1>📣 Cocina</h1>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button id="btnRefrescar" class="btn">Refrescar</button>
    <a class="btn" href="admin.html">Admin</a>
    <a class="btn" href="mozo.html">Mozo</a>
  </div>
</header>

<main>
  <div class="cols">
    <div class="col">
      <h3>Pendientes <span class="pill" id="cntPend">0</span></h3>
      <div id="colPend"></div>
    </div>
    <div class="col">
      <h3>En preparación <span class="pill" id="cntPrep">0</span></h3>
      <div id="colPrep"></div>
    </div>
    <div class="col">
      <h3>Listos <span class="pill" id="cntListo">0</span></h3>
      <div id="colListo"></div>
    </div>
  </div>
</main>

<script>
/* =======================
   SERVER CONFIG COMÚN
   ======================= */
// Permite override guardado:
const savedHost = localStorage.getItem('restopos_server_host');   // ej: "192.168.1.53"
const savedPort = localStorage.getItem('restopos_server_port');   // ej: "3002"

const IS_LOCAL_HOST = ['localhost','127.0.0.1','::1'].includes(location.hostname);
let SERVER;

// Regla: si estás sirviendo esta página desde TU server Node (opción A/B),
// dejá SERVER = location.origin. Si querés forzar IP/puerto locales, setealo
// en localStorage y se usará (solo si la página NO está en https o el backend es https).
if (savedHost) {
  const port = Number(savedPort) || 3002;
  const proto = location.protocol; // ojo con https + backend http (mixed content)
  SERVER = `${proto}//${savedHost}:${port}`;
} else if (location.protocol === 'https:') {
  // en https: por defecto mismo origen (tu backend debe vivir aquí)
  SERVER = location.origin;
} else if (IS_LOCAL_HOST) {
  SERVER = `${location.protocol}//localhost:${Number(savedPort)||3002}`;
} else {
  SERVER = location.origin;
}

console.log('[COCINA] API ->', SERVER);

const api = (p, opt = {}) =>
  fetch(`${SERVER}${p}`, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opt));

let SERVER_OK = false;
let _lastPingTs = 0;
async function ensureServer() {
  const now = Date.now();
  if (now - _lastPingTs < 4000) return SERVER_OK;
  try {
    const r = await api('/api/ping');
    SERVER_OK = r.ok;
  } catch {
    SERVER_OK = false;
  }
  _lastPingTs = now;
  return SERVER_OK;
}

/* =======================
   HELPERS + UI
   ======================= */
const $ = s => document.querySelector(s);
function money(n){ return '$ ' + ((n||0)/100).toFixed(2); }

function toast(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;right:12px;bottom:12px;background:#1e293b;color:#e8eef7;padding:10px 12px;border:1px solid #2b3b59;border-radius:10px;z-index:99999';
  document.body.appendChild(d); setTimeout(()=>d.remove(), 3200);
}

/* =======================
   DATA
   ======================= */
async function fetchOpenOrders(){
  // Usamos el endpoint /api/orders/open (evita 404 por query si tu server difiere)
  try{
    if (!(await ensureServer())) throw new Error('offline');
    const r = await api('/api/orders/open');
    if (!r.ok) {
      // intento alternativo al viejo patrón ?estado=abierto
      const alt = await api('/api/orders?estado=abierto').catch(()=>null);
      if (alt && alt.ok) {
        const jj = await alt.json().catch(()=>({orders:[]}));
        return normalizeOrders(jj.orders||[]);
      }
      throw new Error('http_'+r.status);
    }
    const j = await r.json().catch(()=>({orders:[]}));
    // /api/orders/open devuelve { ok:true, orders:[...] }
    const list = Array.isArray(j) ? j : (j.orders || []);
    return normalizeOrders(list);
  }catch(e){
    console.warn('[COCINA] fetchOpenOrders error:', e?.message || e);
    return [];
  }
}

function normalizeOrders(arr){
  // Evitar duplicados por id/clientId y normalizar campos
  const seen = new Set();
  const out = [];
  for (const o of (arr||[])) {
    const k = String(o && (o.id ?? o.clientId ?? ''));
    if (!k || seen.has(k)) continue;
    seen.add(k);
    const total = (o.total != null)
      ? o.total
      : (o.items||[]).reduce((a,b)=> a + (Number(b.precio)||0)*(Number(b.cant)||0), 0);
    out.push({
      ...o,
      total,
      workflow: o.workflow || 'pendiente',
      nota: (o.nota || '')
    });
  }
  return out;
}

async function setWorkflow(id, workflow){
  try{
    if (!(await ensureServer())) throw new Error('offline');
    const r = await api(`/api/orders/${encodeURIComponent(id)}/status`, {
      method: 'POST',
      body: JSON.stringify({ patch: { workflow } })
    });
    if (!r.ok) {
      const t = await r.text().catch(()=> '');
      throw new Error(`HTTP ${r.status} ${t}`);
    }
    return true;
  }catch(e){
    toast('No se pudo actualizar: ' + (e?.message || e));
    return false;
  }
}

/* =======================
   PRINT
   ======================= */
function printCocina(o){
  const w=window.open('','_blank','width=400,height=600');
  const rows=(o.items||[]).map(it=>`<div>${it.cant} x ${it.nombre}</div>`).join('');
  const fecha=new Date(o.cierre||o.inicio).toLocaleString();
  const nota = (o.nota && String(o.nota).trim())
    ? `<div class="muted" style="margin:6px 0;white-space:pre-wrap;border:1px dashed #666;padding:4px">📝 ${o.nota}</div>`
    : '';
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Comanda</title>
  <style>@page{size:80mm auto;margin:5mm}body{font:12px/1.3 -apple-system,Segoe UI,Roboto,Arial}.muted{color:#666}</style></head><body>
  <div>Mesa: ${o.mesa??'-'} · Mozo: ${o.mozo||'-'}</div>${nota}
  <hr>${rows}<hr><div class="muted">${fecha}</div>
  <script>window.print(); setTimeout(()=>window.close(), 300);<\/script>
  </body></html>`);
  w.document.close();
}

/* =======================
   RENDER
   ======================= */
async function render(){
  let list = [];
  try{
    list = await fetchOpenOrders(); // nunca arroja excepción; si falla devuelve []
  }catch{ list = []; }

  const pend = list.filter(o=>o.workflow==='pendiente');
  const prep = list.filter(o=>o.workflow==='enprep');
  const listo = list.filter(o=>o.workflow==='listo');

  $('#colPend').innerHTML = pend.map(cardHTML).join('');
  $('#colPrep').innerHTML = prep.map(cardHTML).join('');
  $('#colListo').innerHTML = listo.map(cardHTML).join('');
  $('#cntPend').textContent = pend.length;
  $('#cntPrep').textContent = prep.length;
  $('#cntListo').textContent = listo.length;

  // Wire de acciones (defensivo)
  document.querySelectorAll('.card').forEach(card=>{
    const id = Number(card.dataset.id);
    const data = list.find(o=>Number(o.id)===id);
    if (!data) return;
    card.querySelector('.act-print')?.addEventListener('click', ()=> printCocina(data));
    card.querySelector('.act-pend')?.addEventListener('click', async()=>{ if (await setWorkflow(id,'pendiente')) render(); });
    card.querySelector('.act-prep')?.addEventListener('click', async()=>{ if (await setWorkflow(id,'enprep')) render(); });
    card.querySelector('.act-listo')?.addEventListener('click', async()=>{ if (await setWorkflow(id,'listo')) render(); });
    card.querySelector('.act-entregado')?.addEventListener('click', async()=>{ if (await setWorkflow(id,'entregado')) render(); });
  });
}

function cardHTML(o){
  const rows = (o.items||[]).map(it=>`<tr><td>${it.cant} x ${it.nombre}</td><td class="right">${money((it.precio||0)*(it.cant||0))}</td></tr>`).join('');
  const nota = (o.nota && String(o.nota).trim())
    ? `<div class="noteBox">📝 ${o.nota}</div>`
    : '';
  return `
    <div class="card" data-id="${o.id}">
      <div class="meta">
        Mesa ${o.mesa ?? '-'} · ${o.mozo || '-'} · ${new Date(o.inicio).toLocaleTimeString()}
        <span class="tag">${o.tipo||''}</span>
        <span class="tag">Total ${money(o.total||0)}</span>
      </div>
      ${nota}
      <table><tbody>${rows}</tbody></table>
      <div class="actions">
        <button class="btn act-print">Imprimir</button>
        <button class="btn act-pend">Pendiente</button>
        <button class="btn act-prep">En prep</button>
        <button class="btn act-listo">Listo</button>
        <button class="btn act-entregado">Entregado</button>
      </div>
    </div>`;
}

/* =======================
   SSE (en vivo) + BOOT
   ======================= */
document.getElementById('btnRefrescar').onclick = render;

(async function boot(){
  await ensureServer();
  await render();

  // SSE con defensiva (solo si hay server)
  try{
    if (await ensureServer()){
      const es = new EventSource(SERVER + '/api/events');
      es.addEventListener('orders_changed', render);
      es.addEventListener('order_workflow', render);
      es.addEventListener('order_closed', render);
      es.addEventListener('hello', e=>console.log('SSE cocina ok', e.data));
      es.onerror = ()=>console.warn('SSE desconectado…');
    } else {
      console.warn('SSE omitido (server offline)');
    }
  }catch(e){
    console.warn('SSE no disponible', e);
  }
})();
</script>
</body>
</html>
